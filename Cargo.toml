[package]
name = "dirlark"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
license = "Apache-2.0"
description = "Native LDAP directory workbench"

[dependencies]
base64 = "0.22"
directories = "6"
eframe = { version = "0.37", default-features = false, features = ["default_fonts", "glow", "x11", "wayland"] }
image = { version = "0.25.10", default-features = false, features = ["png"] }
keyring = { package = "keyring-core", version = "1.0.1" }
ldap3 = { version = "0.12.1", default-features = false, features = ["tls-rustls-ring"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-native-certs = "0.8"
x509-parser = { version = "=0.18.1", default-features = false }
ring = "=0.17.14"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "net", "io-util"] }
url = "2"
uuid = { version = "1", features = ["v4", "serde"] }
zeroize = "1"

[dev-dependencies]
tempfile = "3"
rcgen = "0.14"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }

[lints.rust]
unsafe_code = "forbid"

[target.'cfg(target_os = "macos")'.dependencies]
apple-native-keyring-store = { version = "1.0.2", features = ["keychain"] }

[target.'cfg(target_os = "windows")'.dependencies]
eframe = { version = "0.37", default-features = false, features = ["wgpu_no_default_features"] }
wgpu = { version = "30.0", default-features = false, features = ["std", "wgsl", "dx12"] }
rfd = { version = "0.17.2", default-features = false }
windows-native-keyring-store = { version = "1.1.0", default-features = false }

[target.'cfg(target_os = "linux")'.dependencies]
dbus-secret-service-keyring-store = { version = "1.0.1", features = ["crypto-rust"] }
