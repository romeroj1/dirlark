name: Advisories
on:
  schedule:
    - cron: '17 5 * * 1'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: advisories
  cancel-in-progress: false
jobs:
  advisories:
    name: RustSec advisories
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout source without persisted credentials
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - name: Install pinned check tools
        run: python3 tools/public_ci.py setup
      - name: Audit locked dependencies
        run: python3 tools/public_ci.py advisories
